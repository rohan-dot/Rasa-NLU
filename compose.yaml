# compose.yaml — Run discver with OSS-CRS
#
# Usage:
#   uv run oss-crs prepare      --compose-file ./compose.yaml
#   uv run oss-crs build-target --compose-file ./compose.yaml --fuzz-proj-path ~/oss-fuzz/projects/libxml2 --target-harness xml --timeout 600
#   uv run oss-crs run          --compose-file ./compose.yaml --fuzz-proj-path ~/oss-fuzz/projects/libxml2 --target-harness xml
#   uv run oss-crs artifacts    --compose-file ./compose.yaml --fuzz-proj-path ~/oss-fuzz/projects/libxml2

run_env: local
docker_registry: local

# Infrastructure sidecar (managed by OSS-CRS)
oss_crs_infra:
  cpuset: "0-1"
  memory: "2G"

# Our CRS
discver:
  extra_hosts:
    - "host.docker.internal:host-gateway"
  source:
    # During development, point to your local checkout.
    # Change to a git URL + ref when publishing.
    local_path: ./example/discver
  cpuset: "2-7"
  memory: "8G"
  environment:
    - DISCVER_GUIDED_JSON=1
    - DISCVER_SINGLE_ACTION=1

# — LLM Config —
# We bypass LiteLLM and call vLLM directly from the CRS code.
# If you later want budget enforcement, uncomment the block below
# and create litellm-config.yaml (see litellm-config.example.yaml).
#
#llm_config:
#  litellm:
#    mode: internal
#    internal:
#      config_path: ./example/discver/litellm-config.yaml
